# Test configuration: replaces src/main/resources/application.properties during tests,
# so the tests run on an in-memory H2 database instead of needing PostgreSQL.
spring.application.name=ionipay-backend-test

spring.datasource.url=jdbc:h2:mem:ionipay;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
